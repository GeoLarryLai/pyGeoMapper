[package]
name = "pygeomapper-py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "PyO3 Python bindings for pygeomapper-core"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pygeomapper-core = { path = "../pygeomapper-core" }
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
