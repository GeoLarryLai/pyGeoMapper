[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pygeomapper"
version = "0.1.0"
description = "A toolkit for automated geological and geomorphic mapping from surface geology, remote sensing and DEM data, with 3D terrain visualization and analysis"
readme = "README-pypi.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Larry Syu-Heng Lai"}]
keywords = ["geology", "geomorphology", "remote-sensing", "change-detection", "dem", "insar", "alphaearth", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "rasterio>=1.3.0",
    "pyproj>=3.4.0",
    "tifffile>=2023.1.0",
    "Pillow>=9.0.0",
    "pystac-client>=0.7.0",
    "scikit-learn>=1.2.0",
    "forge3d>=1.0.0",
    "spyndex>=0.4.0",
    "xdem>=0.0.18",
    "pywbt>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/GeoLarryLai/pyGeoMapper"
Repository = "https://github.com/GeoLarryLai/pyGeoMapper"
Issues = "https://github.com/GeoLarryLai/pyGeoMapper/issues"

[tool.maturin]
python-source = "."
manifest-path = "crates/pygeomapper-py/Cargo.toml"
module-name = "pygeomapper._core"
features = ["pyo3/extension-module"]
include = ["LICENSE", "NOTICE", "README.md", "README-pypi.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
